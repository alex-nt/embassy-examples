[package]
edition = "2024"
name = "bbqueue-sync-nopsram"
version = "0.1.0"
license = "MIT OR Apache-2.0"


[dependencies]
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
    "nightly",
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xb",
    "binary-info",
] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "tcp",
    "udp",
    "raw",
    "dhcpv4",
    "medium-ethernet",
    "dns",
] }
embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-usb-logger = "0.6.0"
cyw43 = { version = "0.7.0", features = [
    "defmt",
    "firmware-logs",
    "bluetooth",
] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }

defmt = "1.1.0"
defmt-rtt = "1.2.0"
fixed = "1.29.0"
fixed-macro = "1.2"

serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

# for assign resources example
assign-resources = { git = "https://github.com/adamgreig/assign-resources", rev = "bd22cb7a92031fb16f74a5da42469d466c33383e" }

#cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
display-interface-spi = "0.5.0"
embedded-graphics = "0.8.2"
mipidsi = "0.10.0"
display-interface = "0.5.0"
byte-slice-cast = { version = "1.2.3", default-features = false }
smart-leds = "0.4.0"
heapless = "0.9.3"
usbd-hid = "0.10.0"

embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embedded-storage = { version = "0.3.1" }
static_cell = "2.1.1"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }
log = "0.4.30"
bbqueue = { version = "0.7.0", features = ["critical-section"] }

[profile.release]
debug = 2

[profile.dev]
debug = 2
lto = true
opt-level = "z"
